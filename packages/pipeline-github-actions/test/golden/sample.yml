# Generated from ci/sample.pipeline.json by ci-adapters. Do not edit this file by hand.
# Regenerate it with the emit command; the check command fails when it drifts.

name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  # Explains why this job exists.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lint
        run: pnpm run lint
  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - lint
    env:
      SHA: ${{ github.sha }}
      NODE_VERSION: ${{ matrix.node }}
    strategy:
      matrix:
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: pnpm test
  gate:
    name: Required checks
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: always()
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo gate
