name: Composite
description: Writes what it was handed, the way an imported composite action runs on the host
inputs:
  message:
    description: The text to carry
    required: true
runs:
  using: composite
  steps:
    - name: Record the input
      run: |
        echo "input=${{ inputs.message }}" >> composite.txt
        echo "ref=${{ github.ref_name }}" >> composite.txt
      shell: bash
    - name: Release only
      if: inputs.message == 'release'
      run: echo "release" >> composite.txt
      shell: bash
