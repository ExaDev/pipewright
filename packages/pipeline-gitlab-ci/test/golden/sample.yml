# Generated from ci/sample.pipeline.json by pipewright. Do not edit this file by hand.
# Regenerate it with the emit command; the check command fails when it drifts.

workflow:
  name: CI
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(main)$/i
    - if: $CI_PIPELINE_SOURCE == "web"
  auto_cancel:
    on_new_commit: interruptible
stages:
  - level-0
  - level-1
  - level-2
# Explains why this job exists.
Lint:
  stage: level-0
  tags:
    - ubuntu-latest
  timeout: 10 minutes
  interruptible: true
  script:
    # Lint
    - pnpm run lint
Test:
  stage: level-1
  tags:
    - ubuntu-latest
  needs:
    - Lint
  parallel:
    matrix:
      - node:
          - "22"
          - "24"
  variables:
    SHA: ${CI_COMMIT_SHA}
    NODE_VERSION: ${node}
  interruptible: true
  script:
    - pnpm test
Required checks:
  stage: level-2
  tags:
    - ubuntu-latest
  needs:
    - Lint
    - Test
  interruptible: true
  script:
    - echo gate
