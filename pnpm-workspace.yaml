packages:
  - "packages/*"

# Sibling dependencies are plain exact versions resolved from the workspace, so a package stays installable if it is ever published. Nothing here publishes today.
linkWorkspacePackages: true
saveWorkspaceProtocol: false
saveExact: true

# Seven days, in minutes, matching the global pnpm configuration. CI never reads the global file, so the limit is repeated here rather than assumed.
minimumReleaseAge: 10080

# ExaDev's own packages, published only from their own CI with trusted publishing.
minimumReleaseAgeExclude:
  - "@exadev/eslint-config"
  - "@exadev/json-compose"
  - "@exadev/process-graph-dag"
  - "@exadev/process-graph-domain"
  - "@exadev/process-graph-projection"
  - "@exadev/process-graph-schema"
  - "@exadev/semantic-release-workspace"
  - "process-graph"
  - "trilean"
  - "trilean-regex"
  - "eslint-plugin-json-canonical"

# esbuild (via vitest) fetches its platform binary in an install script and does not run without it; every other install script stays refused.
allowBuilds:
  esbuild: true

# Versions are exact pins in each manifest, third-party and sibling alike, as in the sibling repositories: a published manifest must stay installable from the registry, which a `catalog:` specifier is not, and `syncpack lint` fails when one dependency is pinned to two versions, which is what a single catalog entry used to prevent. A bump anywhere is then a visible, reviewable diff.

# The release notes generator loads the changelog preset from pnpm's hoisted store before the root, and its writer is version 8, which only the 9.x preset renders. commitlint's own configuration would otherwise bring 10.x, which needs writer 9, so one version is forced for every consumer.
overrides:
  conventional-changelog-conventionalcommits: 9.3.1
