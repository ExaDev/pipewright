# Generated from ci/ci.pipeline.ts by ci-adapters. Do not edit this file by hand.
# Regenerate it with the emit command; the check command fails when it drifts.

# One workflow for the whole workspace. Every check runs from the repository root.
name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
# A new push to a branch supersedes that branch's in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  # ESLint over the whole workspace, with no warnings allowed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
  # One TypeScript program for every package.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
  # Unit tests, including each adapter's conformance kit. Rendered in the wrapper form, so this job runs through the tool's own runner.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Test
        run: node packages/cli/src/bin.ts run --pipeline ci/ci.pipeline.ts --job test --steps 4-4
  # Fails when a generated file differs from what the tool emits now.
  drift:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated files
        run: node packages/cli/src/bin.ts check --pipeline ci/ci.pipeline.ts --provider github-actions --tool-command "node packages/cli/src/bin.ts" && node packages/cli/src/bin.ts check --pipeline ci/e2e.pipeline.ts --provider github-actions --tool-command "node packages/cli/src/bin.ts" && node packages/cli/src/bin.ts schema | diff -u schemas/pipeline.schema.json - && node packages/cli/src/bin.ts schema --authoring | diff -u schemas/pipeline.authoring.schema.json -
  # Validates the emitted workflow with GitHub's own linter rules.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
  # Runs each provider's own validator over the configuration the tool emits for it: actionlint for GitHub, and the published JSON Schemas for GitLab, Bitbucket and CircleCI.
  validators:
    name: Provider validators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install the CircleCI CLI
        run: curl -fsSL -o "$RUNNER_TEMP/circleci.tgz" https://github.com/CircleCI-Public/circleci-cli/releases/download/v1.4.0/circleci-cli_1.4.0_linux_amd64.tar.gz && echo "96c3de64d815b076725f5f05aa626d83eaf39b1332a6b1f7e5dbaf46af43f169  $RUNNER_TEMP/circleci.tgz" | sha256sum -c - && mkdir -p "$HOME/.local/bin" && tar -xzf "$RUNNER_TEMP/circleci.tgz" -C "$HOME/.local/bin" circleci && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate
        run: pnpm run test:integration
  # Reads this very run back through the platform adapter with the workflow token, so the live read path is exercised on every run. A required-check comparison is not possible here: rulesets are unavailable to a private repository on this organisation's plan, and the API answers 403.
  platform-smoke:
    name: Platform read path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Read this run
        run: node packages/cli/src/bin.ts platform run --repo "$REPOSITORY" --run "$RUN_ID" | grep -E "queued|running|waiting"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: List this commit's checks
        run: node packages/cli/src/bin.ts platform checks --repo "$REPOSITORY" --sha "$COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
    env:
      REPOSITORY: ${{ github.repository }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_ID: ${{ github.run_id }}
  # Dispatches the emitted end-to-end workflow on GitHub through the platform adapter, waits for it, and compares the check names GitHub reports with the ones the compiler derived. It runs after a merge to main, because a workflow can be dispatched only once its file is on the default branch, and it is not part of the gate, which counts a skipped job as failed.
  e2e:
    name: End to end on GitHub
    runs-on: ubuntu-latest
    if: (((github.event_name == 'push')) && (github.ref_name == 'main'))
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dispatch and watch
        run: pnpm run test:e2e
        env:
          GH_TOKEN: ${{ github.token }}
    env:
      REPOSITORY: ${{ github.repository }}
      E2E_REF: ${{ github.ref_name }}
  # The single branch-protection target. It runs whatever the other jobs concluded and fails unless all succeeded.
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - drift
      - actionlint
      - validators
      - platform-smoke
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Report
        run: echo all required jobs succeeded
