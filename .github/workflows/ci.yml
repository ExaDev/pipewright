# Generated from ci/ci.pipeline.json by ci-adapters. Do not edit this file by hand.
# Regenerate it with the emit command; the check command fails when it drifts.

# One workflow for the whole workspace. Every check runs from the repository root.
name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
# A new push to a branch supersedes that branch's in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  # Validates the emitted workflow with GitHub's own linter rules.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
  # Compares the check names this pipeline produces with the branch ruleset's required checks, through the platform adapter. Reports only: applying a ruleset change is a person's decision.
  check-names:
    name: Required check names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .tool-versions
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compare required checks
        run: node packages/cli/src/bin.ts check-names --pipeline ci/ci.pipeline.json --provider github-actions --scope gates --repo "$REPOSITORY" --branch main
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
  # Fails when a generated file differs from what the tool emits now.
  drift:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .tool-versions
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated files
        run: node packages/cli/src/bin.ts check --pipeline ci/ci.pipeline.json --provider github-actions --tool-command "node packages/cli/src/bin.ts" && node packages/cli/src/bin.ts schema | diff -u schemas/pipeline.schema.json - && node packages/cli/src/bin.ts schema --authoring | diff -u schemas/pipeline.authoring.schema.json -
  # ESLint over the whole workspace, with no warnings allowed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .tool-versions
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
  # The single branch-protection target. It runs whatever the other jobs concluded and fails unless all succeeded.
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - drift
      - actionlint
    if: always()
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        name: Fail when a required job did not succeed
        run: exit 1
      - name: Report
        run: echo all required jobs succeeded
  # Unit tests, including each adapter's conformance kit. Rendered in the wrapper form, so this job runs through the tool's own runner.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .tool-versions
      - name: Run Test
        run: node packages/cli/src/bin.ts run --pipeline ci/ci.pipeline.json --job test --steps 3-4
  # One TypeScript program for every package.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .tool-versions
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
