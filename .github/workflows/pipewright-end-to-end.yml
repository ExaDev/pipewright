# Dispatched by the end-to-end test, which waits for the run and compares the check names GitHub reports with the ones the compiler derived.
name: Pipewright end to end
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  # A matrix value reaches the step as an environment value.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_AXIS: ${{ matrix.node }}
      COMMIT: ${{ github.sha }}
    strategy:
      matrix:
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@v7
      - name: Check the matrix value
        run: test -n "$NODE_AXIS" && test -n "$COMMIT" && echo "axis=$NODE_AXIS"
  # Rendered in the wrapper form, so the tool's own runner executes these steps on GitHub.
  wrapped:
    name: Wrapped
    runs-on: ubuntu-latest
    needs:
      - build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Wrapped
        run: node packages/cli/src/bin.ts run --pipeline ci/e2e.pipeline.ts --job wrapped --steps 4-4
  gate:
    name: End to end gate
    runs-on: ubuntu-latest
    needs:
      - build
      - wrapped
    if: always()
    timeout-minutes: 10
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Report
        run: echo end-to-end-ok
